<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Сомнительный дом — мини-экскурсия</title>
  <meta name="description" content="3D-экскурсия по дому и каталог строительных направлений на Three.js." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body class="hub-body">
  <div class="hub">
    <canvas id="nav-canvas" aria-label="3D-экскурсия по дому"></canvas>

    <div class="hub-ui">
      <header class="hub-top">
        <div class="hub-brand">
          <p class="webgl-badge">Three.js · мини-экскурсия</p>
          <h1>Сомнительный дом*</h1>
          <p id="tour-copy">Пройдите по комнатам и нажмите на золотую плитку — откроется направление.</p>
        </div>
        <div class="hub-actions">
          <button type="button" class="btn btn--ghost" id="tour-prev" aria-label="Предыдущая точка">←</button>
          <button type="button" class="btn btn--ghost" id="tour-next">Далее</button>
          <button type="button" class="btn" id="tour-open">Открыть</button>
          <a class="btn btn--ghost" href="#list">Список</a>
        </div>
      </header>

      <div class="hub-spacer" aria-hidden="true"></div>

      <div class="hub-bottom">
        <ol class="tour-steps" id="tour-steps" aria-label="Точки экскурсии"></ol>
        <p class="hub-hint" id="hub-hint">Загрузка экскурсии…</p>
      </div>
    </div>

    <nav class="hub-fallback" id="hub-fallback" aria-label="Категории">
      <div class="hub-fallback__list" id="list">
        <a href="private.html">Стройка домов на частной территории</a>
        <a href="summer.html">Стройка летних домиков</a>
        <a href="landscaping.html">Отделка участка</a>
        <a href="finish.html">Отделка домов под ключ</a>
        <a href="apartments.html">Стройка многоквартирных домов</a>
      </div>
    </nav>
  </div>

  <script type="module" src="js/nav3d.js"></script>
  <script>
    if (window.matchMedia("(max-width: 760px)").matches) {
      document.getElementById("hub-fallback")?.classList.add("is-visible");
    }
    document.querySelector('a[href="#list"]')?.addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("hub-fallback")?.classList.add("is-visible");
      document.getElementById("list")?.scrollIntoView({ behavior: "smooth" });
    });
  </script>
</body>
</html>
